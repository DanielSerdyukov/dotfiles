"$schema" = 'https://starship.rs/config-schema.json'

format = """
$os\
$username\
[ ](bg:color_bg2 fg:color_bg1)\
$directory\
[ ](bg:color_bg3 fg:color_bg2)\
$git_branch\
$git_status\
$git_metrics\
[ ](bg:none fg:color_bg3)\
$fill\
$rust\
$python\
$package\
$cmd_duration\
$hostname\
$line_break$character
"""

palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
color_fg1 = "#cdd6f4"
color_fg2 = "#89b4fa"
color_bg1 = "#282839"
color_bg2 = "#313244"
color_bg3 = "#45475a"
color_bg4 = "#585b70"
color_bg5 = "#6c7086"
color_success = "#a6e3a1"
color_error = "#f38ba8"
color_rust = "#fab387"
color_python = "#f9e2af"
color_package = "#b4befe"

[os]
disabled = false
style = "bg:color_bg1 fg:color_fg1"
format = "[ $symbol ]($style)"

[os.symbols]
Macos = "󰀵"
Ubuntu = "󰕈"
Debian = "󰣚"
Redhat = "󱄛"
Windows = "󰍲"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
RedHatEnterprise = "󱄛"

[username]
style_user = "bg:color_bg1 fg:color_fg1"
style_root = "bg:color_bg1 fg:color_error"
format = "[ $user in ]($style)"

[directory]
read_only = "  "
style = "bg:color_bg2 fg:color_fg1"
read_only_style = "bg:color_bg2 fg:color_error"
format = "[$read_only]($read_only_style)[ $path ]($style)"
truncation_length = 3

[git_branch]
symbol = ""
style = "bg:color_bg3 fg:color_fg1"
format = "[on $symbol $branch]($style)"

[git_status]
style = "bg:color_bg3 fg:color_fg2"
format = "[ ($all_status$ahead_behind) ]($style)"

[git_metrics]
disabled = false
added_style = "bg:color_bg3 fg:color_success"
deleted_style = "bg:color_bg3 fg:color_error"
format = "([+$added ]($added_style))([-$deleted ]($deleted_style))"

[fill]
symbol = " "
style = "bg:none fg:color_fg1"

[package]
symbol = ""
style = "fg:color_package"
format = "[ $symbol $version ]($style)"

[rust]
symbol = ""
style = "fg:color_rust"
format = "[ $symbol $version ]($style)"

[python]
symbol = ""
style = "fg:color_python"
format = "[ $symbol $version( \\($virtualenv\\)) ]($style)"

[cmd_duration]
style = "fg:color_fg1"
format = "[  $duration ]($style)"

[hostname]
ssh_only = true
ssh_symbol = "󰖟 "
style = "fg:color_fg2"
format = "[ $ssh_symbol$hostname ]($style)"
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:color_success)'
error_symbol = '[](bold fg:color_error)'
